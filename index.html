<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leaving NYC</title>
  <meta name="description" content="How bad is it getting out of New York tonight? Live traffic on every bridge and tunnel.">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <aside id="panel">
    <header>
      <h1>Leaving <span>NYC</span></h1>
      <p class="sub" id="dateline">Loading today's traffic…</p>
    </header>

    <section class="time">
      <div class="time-row">
        <button id="play" title="Replay today">▶</button>
        <input id="slider" type="range" min="0" max="0" value="0">
        <button id="live" class="on">LIVE</button>
      </div>
      <div class="time-label" id="timeLabel">—</div>
      <div class="legend">
        <span><i style="background:var(--g)"></i>moving</span>
        <span><i style="background:var(--y)"></i>slow</span>
        <span><i style="background:var(--r)"></i>jammed</span>
        <span><i style="background:var(--rr)"></i>stopped</span>
      </div>
    </section>

    <section>
      <h2>Off the island</h2>
      <ul class="crossings" id="manhattan"></ul>
      <h2>Out of the city</h2>
      <ul class="crossings" id="city"></ul>
    </section>

    <section class="bulletin">
      <h2>Tonight's bulletin</h2>
      <div id="bulletin">…</div>
      <button id="makeVideo" class="big">Make Instagram video</button>
      <button id="makePost" class="big ghost">Make Instagram image</button>
    </section>

    <footer>Data: NYC DOT real-time traffic speeds (NYC Open Data). Delay = travel time vs. the same road at 1–4am.</footer>
  </aside>

  <div id="postModal" hidden>
    <div class="modal-inner">
      <img id="postImg" alt="Instagram post preview">
      <video id="postVideo" controls loop muted playsinline hidden></video>
      <div class="modal-actions">
        <a id="postDownload" class="big" download="leaving-nyc.png">Download image</a>
        <button id="copyCaption" class="big ghost">Copy caption</button>
        <button id="closeModal" class="big ghost">Close</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="app.js"></script>
</body>
</html>
