# Backup traffic reading (TomTom) for the roads NYC DOT isn't covering right now, saved to
# today's file on the `data` branch. cron-job.org starts it every 20 minutes from 3pm to 8pm
# New York time (GitHub's own timer is too unreliable for this). TomTom's free plan allows
# 20,000 readings a month: about 8 dead DOT sensors x 16 runs a day on a normal day (~4,000 a
# month), up to 16 roads x 16 runs when the whole DOT feed is down.
name: Backup traffic reading

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: data
          path: data

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read traffic
        env:
          TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}
        run: node scripts/poll.mjs --data data

      - name: Save
        run: |
          cd data
          git config user.name "leavingnyctonight-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -qm "Reading $(TZ=America/New_York date '+%F %H:%M')"
          for i in 1 2 3; do git push -q && break; git pull -q --rebase; done
